version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must stay on the same patch or `npm ci` / peers fail (e.g. Vercel).
      react:
        patterns:
          - "react"
          - "react-dom"
